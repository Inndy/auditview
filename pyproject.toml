[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditview"
version = "0.1.0"
description = "Code review/audit tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "flask>=3.1",
  "waitress>=3.0",
  "watchdog>=6.0",
  "pathspec>=0.12",
  "apsw>=3.49",
]

[project.scripts]
auditview = "auditview.__main__:main"

[tool.setuptools.packages.find]
include = ["auditview*"]

[tool.setuptools.package-data]
auditview = ["static/**/*"]
