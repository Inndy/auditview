[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditview"
version = "0.1.4"
description = "Code review/audit tool"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt"]
readme = "README.md"
requires-python = ">=3.14"
keywords = ["code-review", "security-audit", "review-coverage", "vibe-coding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "quart>=0.19",
  "uvicorn>=0.29",
  "aiosqlite>=0.20",
  "watchdog>=6.0",
  "pathspec>=0.12",
  # v1 only: api/mcp.py imports mcp.server.fastmcp.FastMCP and
  # .server.StreamableHTTPASGIApp, both of which mcp 2.x renamed or moved.
  # uv.lock already pins 1.27.1, so `uv sync` was unaffected -- this bound is
  # for installs that bypass the lock (pip install -e ., or the built wheel).
  "mcp>=1.27.1,<2",
]

[project.urls]
Homepage = "https://github.com/Inndy/auditview"
Repository = "https://github.com/Inndy/auditview"
Issues = "https://github.com/Inndy/auditview/issues"

[project.scripts]
auditview = "auditview.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = ["fuzz: slow randomized fuzz tests (deselect with '-m not fuzz')"]
addopts = "-m 'not fuzz'"

[tool.setuptools.packages.find]
include = ["auditview*"]

[tool.setuptools.package-data]
auditview = ["static/**/*"]
