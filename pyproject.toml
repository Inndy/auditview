[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditview"
version = "0.1.1"
description = "Code review/audit tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "quart>=0.19",
  "uvicorn>=0.29",
  "aiosqlite>=0.20",
  "watchdog>=6.0",
  "pathspec>=0.12",
  "mcp>=1.27.1",
]

[project.scripts]
auditview = "auditview.__main__:main"

[tool.setuptools.packages.find]
include = ["auditview*"]

[tool.setuptools.package-data]
auditview = ["static/**/*"]
