[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditview"
version = "0.1.3"
description = "Code review/audit tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "quart>=0.19",
  "uvicorn>=0.29",
  "aiosqlite>=0.20",
  "watchdog>=6.0",
  "pathspec>=0.12",
  # v1 only: api/mcp.py imports mcp.server.fastmcp.FastMCP and
  # .server.StreamableHTTPASGIApp, both of which mcp 2.x renamed or moved.
  # uv.lock already pins 1.27.1, so `uv sync` was unaffected -- this bound is
  # for installs that bypass the lock (pip install -e ., or the built wheel).
  "mcp>=1.27.1,<2",
]

[project.scripts]
auditview = "auditview.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = ["fuzz: slow randomized fuzz tests (deselect with '-m not fuzz')"]
addopts = "-m 'not fuzz'"

[tool.setuptools.packages.find]
include = ["auditview*"]

[tool.setuptools.package-data]
auditview = ["static/**/*"]
